server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅 — 모든 경로를 index.html로 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 에셋 캐싱 (Vite가 해시를 붙이므로 장기 캐시 가능)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
